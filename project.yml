name: Speak
options:
  bundleIdPrefix: com.danzerzine
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Minor-pinned to the versions the app is built and tested with: 0.x releases may
# break the API (ParakeetVocabulary relies on FluidAudio internals). Bump deliberately.
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    majorVersion: 6.29.3
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    minorVersion: 0.18.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    minorVersion: 0.17.5

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
    Release:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES

targets:
  Speak:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/App
      - path: Sources/UI
      - path: Sources/Core
      - path: Sources/ObjCCatch
      - path: Sources/Whisper
        optional: true
      - path: Resources/radio.svg
        buildPhase: resources
      - path: Resources/settings.svg
        buildPhase: resources
      # Icon Composer file: actool turns it into Assets.car (macOS 26 glass) and AppIcon.icns (14-15).
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/terminology-default-ru.json
        buildPhase: resources
      - path: Resources/terminology-default-uk.json
        buildPhase: resources
      - path: Resources/terminology-default-en.json
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: "Speak!"
        CFBundleName: Speak
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: Speak! records your speech while you hold the hotkey and turns it into text.
        NSHumanReadableCopyright: ""
        # Right-click a misheard word anywhere: opens Terms with it typed in.
        NSServices:
          - NSMenuItem:
              default: "Fix Spelling in Speak!"
            NSMessage: fixSpelling
            NSPortName: Speak
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
            NSRequiredContext: {}
    entitlements:
      path: Resources/HoldSpeak.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danzerzine.speak
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/HoldSpeak-Bridging-Header.h
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
